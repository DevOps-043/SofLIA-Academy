name: Importar grabaciones privadas

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-recording-importer
  cancel-in-progress: false

jobs:
  import:
    # Solo el código revisado de main recibe las credenciales de producción.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    steps:
      - name: Descargar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Instalar dependencias sin scripts de terceros
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Preparar FFprobe
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -n 1
          npm run build --workspace=@aprende-y-aplica/shared

      - name: Reconciliar e importar un lote
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mrqnnmuckznvukjvfkly.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RECORDING_SUPABASE_SERVICE_ROLE_KEY }}
          LIVE_VIDEO_PROVIDER: zoom-video
          ZOOM_VIDEO_ACCOUNT_ID: xgn2iEOGTFeEUAWUoCeWjA
          ZOOM_VIDEO_API_KEY: ${{ secrets.RECORDING_ZOOM_VIDEO_API_KEY }}
          ZOOM_VIDEO_API_JWT_ISSUER: ${{ secrets.RECORDING_ZOOM_VIDEO_API_JWT_ISSUER }}
          ZOOM_VIDEO_API_JWT_SECRET: ${{ secrets.RECORDING_ZOOM_VIDEO_API_JWT_SECRET }}
          RECORDING_S3_ENDPOINT: https://mrqnnmuckznvukjvfkly.storage.supabase.co/storage/v1/s3
          RECORDING_S3_REGION: us-west-2
          RECORDING_S3_ACCESS_KEY: ${{ secrets.RECORDING_S3_ACCESS_KEY }}
          RECORDING_S3_SECRET_KEY: ${{ secrets.RECORDING_S3_SECRET_KEY }}
          RECORDING_SPOOL_DIRECTORY: ${{ runner.temp }}/soflia-recordings
        run: |
          required=(SUPABASE_SERVICE_ROLE_KEY RECORDING_S3_ACCESS_KEY RECORDING_S3_SECRET_KEY)
          if [ -n "$ZOOM_VIDEO_API_JWT_ISSUER" ] || [ -n "$ZOOM_VIDEO_API_JWT_SECRET" ]; then
            required+=(ZOOM_VIDEO_API_JWT_ISSUER ZOOM_VIDEO_API_JWT_SECRET)
          else
            required+=(ZOOM_VIDEO_API_KEY)
          fi
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta una credencial del importador: $name"
              exit 1
            fi
          done
          npm run recordings:worker -- --drain

      # No se suben vídeos, URLs, secretos ni temporales como artifacts/cache.
      - name: Registrar resultado
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Importador de grabaciones privadas: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Los vídeos confirmados permanecen en Storage privado. Revisar los logs y la cola si falla un lote.' >> "$GITHUB_STEP_SUMMARY"
